<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - Sr. JOTA</title>
    <style>
        :root {
            /* Cores Globais e Tela 2 (Escura) */
            --primary: #3b82f6; 
            --primary-hover: #2563eb;
            --background-dark: #0f172a; 
            --container-bg: #1e293b; 
            --text-light: #f8fafc; 
            --text-muted: #94a3b8; 
            --border: #334155; 
            
            --success-bg: #064e3b;
            --success-border: #059669;
            --success-text: #a7f3d0;
            
            --warning-bg: #451a03;
            --warning-border: #b45309;
            --warning-text: #fde68a;

            /* Cores Tela 1 (Linktree) */
            --linktree-bg: linear-gradient(135deg, #1e3a8a, #0f172a);
            --card-bg: linear-gradient(to right, #b9d2eb, #cbe0f5);
            --card-text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: var(--linktree-bg);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* ========================================= */
        /* ESTILOS DA TELA 1: LINKS DA BIO           */
        /* ========================================= */
        #screen-links {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            display: flex; /* Tela principal visível por padrão */
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .profile-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 15px;
            background-color: #334155; /* Cor de fundo caso a imagem falhe */
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        .profile-subtitle {
            font-size: 1.1rem;
            color: #93c5fd;
            margin: 0;
            font-weight: 500;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Estilo dos Botões/Cards */
        .link-card {
            background: var(--card-bg);
            color: var(--card-text);
            text-decoration: none;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            text-align: left;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .link-card-left-icon {
            width: 40px;
            height: 40px;
            background-color: rgba(255,255,255,0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 15px;
            overflow: hidden;
        }
        
        .link-card-left-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .link-card-left-icon svg {
            width: 24px;
            height: 24px;
            fill: #1e293b;
        }

        .link-card-text {
            flex-grow: 1;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .link-card-right-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-card-right-icon svg {
            width: 20px;
            height: 20px;
            fill: #475569;
        }

        /* ========================================= */
        /* ESTILOS DA TELA 2: VERIFICADOR (ESCURO)   */
        /* ========================================= */
        #screen-checker {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: none; /* Oculto por padrão */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background-color: var(--background-dark);
            min-height: 100vh;
        }

        .back-button {
            align-self: flex-start;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            padding: 10px 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .checker-container {
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .checker-container h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .checker-container p {
            color: var(--text-muted);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background-color: var(--background-dark);
            color: var(--text-light);
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }
        
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--container-bg);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .suggestions-list::-webkit-scrollbar {
            width: 8px;
        }
        .suggestions-list::-webkit-scrollbar-track {
            background: var(--container-bg);
        }
        .suggestions-list::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 10px;
        }

        .suggestions-list li {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            color: var(--text-light);
        }

        .suggestions-list li:hover {
            background-color: var(--border);
            color: var(--primary);
        }

        .suggestions-list li:last-child {
            border-bottom: none;
        }

        .btn-check {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-check:hover {
            background-color: var(--primary-hover);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .unsupported {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
        }

        .result a {
            color: #60a5fa; 
            text-decoration: none;
            font-weight: bold;
        }

        .result a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- TELA 2: APLICATIVO VERIFICADOR DE ESPELHAMENTO                            -->
<!-- ========================================================================= -->
<div id="screen-checker">
    
    <!-- Botão de Voltar para a tela de Links -->
    <button class="back-button" onclick="closeChecker()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Voltar para Meus Links
    </button>

    <div class="checker-container">
        <h1>Descubra como espelhar seu celular na TV</h1>
        <p>Digite o modelo do seu aparelho abaixo:</p>
        
        <div class="search-box">
            <input type="text" id="phoneInput" placeholder="Ex: Galaxy S23, iPhone 15..." autocomplete="off">
            <ul id="suggestionsList" class="suggestions-list"></ul>
        </div>
        
        <button class="btn-check" onclick="checkCompatibility()">Verificar Aparelho</button>

        <div id="resultBox" class="result"></div>

</div>

<script>
    /* ========================================================================= */
    /* LÓGICA DE TRANSIÇÃO ENTRE TELAS                                           */
    /* ========================================================================= */
    const screenLinks = document.getElementById('screen-links');
    const screenChecker = document.getElementById('screen-checker');

    // Função para mostrar a tela de verificação
    function openChecker() {
        screenLinks.style.display = 'none';
        screenChecker.style.display = 'flex';
        // Foca automaticamente no campo de pesquisa
        setTimeout(() => document.getElementById('phoneInput').focus(), 100);
    }

    // Função para voltar à tela de links
    function closeChecker() {
        screenChecker.style.display = 'none';
        screenLinks.style.display = 'flex';
        
        // Opcional: Limpar a busca ao voltar
        document.getElementById('phoneInput').value = '';
        document.getElementById('suggestionsList').style.display = 'none';
        document.getElementById('resultBox').style.display = 'none';
    }


    /* ========================================================================= */
    /* LÓGICA DO VERIFICADOR (ARRAY, AUTOCOMPLETAR E VERIFICAÇÃO)                */
    /* ========================================================================= */
    const dpAltModePhones = [
        "Samsung Galaxy S8", "Samsung Galaxy S8+", "Samsung Galaxy S8 Active",
        "Samsung Galaxy S9", "Samsung Galaxy S9+", "Samsung Galaxy S10e", "Samsung Galaxy S10", "Samsung Galaxy S10+", "Samsung Galaxy S10 5G", "Samsung Galaxy S10 Lite",
        "Samsung Galaxy S20", "Samsung Galaxy S20+", "Samsung Galaxy S20 Ultra", "Samsung Galaxy S20 FE",
        "Samsung Galaxy S21", "Samsung Galaxy S21+", "Samsung Galaxy S21 Ultra", "Samsung Galaxy S21 FE",
        "Samsung Galaxy S22", "Samsung Galaxy S22+", "Samsung Galaxy S22 Ultra",
        "Samsung Galaxy S23", "Samsung Galaxy S23+", "Samsung Galaxy S23 Ultra", "Samsung Galaxy S23 FE",
        "Samsung Galaxy S24", "Samsung Galaxy S24+", "Samsung Galaxy S24 Ultra", "Samsung Galaxy S24 FE",
        "Samsung Galaxy S25", "Samsung Galaxy S25+", "Samsung Galaxy S25 Ultra", "Samsung Galaxy S25 Slim",
        "Samsung Galaxy S26", "Samsung Galaxy S26+", "Samsung Galaxy S26 Ultra",
        "Samsung Galaxy Note 8", "Samsung Galaxy Note 9", "Samsung Galaxy Note 10", "Samsung Galaxy Note 10+", "Samsung Galaxy Note 10 Lite",
        "Samsung Galaxy Note 20", "Samsung Galaxy Note 20 Ultra",
        "Samsung Galaxy Fold", "Samsung Galaxy Z Fold 2", "Samsung Galaxy Z Fold 3", "Samsung Galaxy Z Fold 4", "Samsung Galaxy Z Fold 5", "Samsung Galaxy Z Fold 6", "Samsung Galaxy Z Fold 7",
        "Samsung Galaxy Z Flip 6",
        "Apple iPhone 15", "Apple iPhone 15 Plus", "Apple iPhone 15 Pro", "Apple iPhone 15 Pro Max",
        "Apple iPhone 16", "Apple iPhone 16 Plus", "Apple iPhone 16 Pro", "Apple iPhone 16 Pro Max",
        "Apple iPhone 17", "Apple iPhone 17 Slim", "Apple iPhone 17 Pro", "Apple iPhone 17 Pro Max",
        "Motorola Moto Edge+ (2020)", "Motorola Moto Edge 20 Pro", "Motorola Moto Edge 30 Pro", "Motorola Moto Edge 30 Ultra", "Motorola Moto Edge 40 Pro", "Motorola Moto Edge 50 Pro", "Motorola Moto Edge 50 Ultra",
        "Motorola Moto G100", "Motorola Moto G200 5G", "Motorola ThinkPhone by Motorola", "Motorola ThinkPhone 25",
        "LG G5", "LG G6", "LG G7 ThinQ", "LG G8 ThinQ", "LG G8X ThinQ", "LG G8S ThinQ", "LG V20", "LG V30", "LG V30S ThinQ", "LG V40 ThinQ", "LG V50 ThinQ", "LG V60 ThinQ", "LG Velvet", "LG Wing",
        "ASUS ROG Phone", "ASUS ROG Phone II", "ASUS ROG Phone 3", "ASUS ROG Phone 5", "ASUS ROG Phone 6", "ASUS ROG Phone 7", "ASUS ROG Phone 8", "ASUS ROG Phone 9",
        "ASUS Zenfone 3 Deluxe", "ASUS Zenfone 9", "ASUS Zenfone 10", "ASUS Zenfone 11 Ultra",
        "Xiaomi 13 Ultra", "Xiaomi 14 Ultra", "Xiaomi 15 Ultra", "Black Shark 2", "Black Shark 3", "Black Shark 4", "Black Shark 5",
        "Sony Xperia 1", "Sony Xperia 1 II", "Sony Xperia 1 III", "Sony Xperia 1 IV", "Sony Xperia 1 V", "Sony Xperia 1 VI",
        "Sony Xperia 5", "Sony Xperia 5 II", "Sony Xperia 5 III", "Sony Xperia 5 IV", "Sony Xperia 5 V", "Sony Xperia Pro", "Sony Xperia Pro-I",
        "Google Pixel 8", "Google Pixel 8 Pro", "Google Pixel 9", "Google Pixel 9 Pro", "Google Pixel 9 Pro XL", "Google Pixel 9 Pro Fold", "Google Pixel 10", "Google Pixel 10 Pro",
        "OnePlus 7", "OnePlus 7 Pro", "OnePlus 7T", "OnePlus 7T Pro", "OnePlus 8", "OnePlus 8 Pro", "OnePlus 8T", "OnePlus 9", "OnePlus 9 Pro", "OnePlus 10 Pro", "OnePlus 11", "OnePlus 12", "OnePlus 13", "OnePlus Open",
        "Huawei Mate 10", "Huawei Mate 10 Pro", "Huawei Mate 20", "Huawei Mate 20 Pro", "Huawei Mate 20 X", "Huawei Mate 30", "Huawei Mate 30 Pro", "Huawei Mate 40", "Huawei Mate 40 Pro", "Huawei Mate 50", "Huawei Mate 50 Pro", "Huawei Mate 60", "Huawei Mate 60 Pro",
        "Huawei P20", "Huawei P20 Pro", "Huawei P30", "Huawei P30 Pro", "Huawei P40", "Huawei P40 Pro", "Huawei P50", "Huawei P50 Pro", "Huawei P60", "Huawei P60 Pro",
        "RedMagic 5G", "RedMagic 6", "RedMagic 7", "RedMagic 8 Pro", "RedMagic 9 Pro", "RedMagic 10 Pro",
        "ZTE Axon 10 Pro", "ZTE Axon 30 Ultra", "ZTE Axon 40 Ultra",
        "HTC 10", "HTC U11", "HTC U11+", "HTC U12+", "HTC U20 5G"
    ];

    const mhlPhones = [
        "Samsung Galaxy S3", "Samsung Galaxy S4", "Samsung Galaxy S4 Zoom", "Samsung Galaxy S5", "Samsung Galaxy S5 Active",
        "Samsung Galaxy Note 2", "Samsung Galaxy Note 3", "Samsung Galaxy Note 4", "Samsung Galaxy Note Edge",
        "Motorola Razr HD", "Motorola Moto Maxx",
        "LG Optimus G Pro", "LG G2", "LG G3", "LG G4"
    ];

    const allPhones = [...dpAltModePhones, ...mhlPhones].sort();

    const inputElement = document.getElementById('phoneInput');
    const suggestionsList = document.getElementById('suggestionsList');

    // Lógica de Autocompletar Inteligente
    inputElement.addEventListener('input', function() {
        const inputValue = this.value.trim().toLowerCase();
        
        suggestionsList.innerHTML = '';

        if (inputValue.length === 0) {
            suggestionsList.style.display = 'none';
            return;
        }

        const searchTerms = inputValue.split(' ').filter(term => term.length > 0);

        const filteredPhones = allPhones.filter(phone => {
            const phoneNameLower = phone.toLowerCase();
            return searchTerms.every(term => phoneNameLower.includes(term));
        });

        if (filteredPhones.length > 0) {
            filteredPhones.forEach(phone => {
                const li = document.createElement('li');
                li.textContent = phone;
                
                li.addEventListener('click', function() {
                    inputElement.value = phone; 
                    suggestionsList.style.display = 'none'; 
                    checkCompatibility(); 
                });
                
                suggestionsList.appendChild(li);
            });
            suggestionsList.style.display = 'block';
        } else {
            suggestionsList.style.display = 'none';
        }
    });

    // Ocultar sugestões ao clicar fora
    document.addEventListener('click', function(event) {
        if (event.target !== inputElement && event.target !== suggestionsList) {
            suggestionsList.style.display = 'none';
        }
    });

    // Lógica de Verificação
    function checkCompatibility() {
        const input = document.getElementById('phoneInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        suggestionsList.style.display = 'none';
        
        if (!input) {
            resultBox.style.display = 'block';
            resultBox.className = 'result unsupported';
            resultBox.innerHTML = 'Por favor, digite o modelo do seu aparelho.';
            return;
        }

        const isDpAlt = dpAltModePhones.find(p => p.toLowerCase() === input.toLowerCase());
        const isMhl = mhlPhones.find(p => p.toLowerCase() === input.toLowerCase());

        resultBox.style.display = 'block';

        if (isDpAlt) {
            resultBox.className = 'result success';
            resultBox.innerHTML = `<strong>Boas notícias!</strong> O <strong>${isDpAlt}</strong> possui a tecnologia <strong>DP Alt Mode (Tipo C)</strong>. Você só precisa de um cabo Type-C para HDMI padrão. É plugar e usar, sem aplicativos!`;
        } else if (isMhl) {
            resultBox.className = 'result success';
            resultBox.innerHTML = `<strong>Boas notícias!</strong> O <strong>${isMhl}</strong> possui a tecnologia <strong>MHL (Micro USB)</strong>. Você só precisa de um cabo MHL compatível. É plugar e usar!`;
        } else {
            resultBox.className = 'result unsupported';
            resultBox.innerHTML = `
                O aparelho <strong>${input}</strong> não possui espelhamento automático via cabo nativo.<br><br>
                Mas não se preocupe! Você pode usar o <strong>Cabo LD39</strong> para resolver isso.<br><br>
                👉 <a href="LINK_DO_SEU_VIDEO_AQUI" target="_blank">Assista meu vídeo ensinando a usar o LD39</a><br>
                🛒 <a href="LINK_DO_SEU_TIKTOK_AQUI" target="_blank">Compre o Cabo LD39 com segurança aqui</a>
            `;
        }
    }
